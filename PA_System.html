<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PA System</title>

<style>

/* ✅ BACKGROUND */
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

/* ✅ CARD */
.card{
    background:rgba(255,255,255,0.08);
    padding:25px;
    border-radius:25px;
    width:90%;
    max-width:340px;
    text-align:center;
    backdrop-filter:blur(15px);
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

/* ✅ TITLE */
h2{
    margin:10px 0;
    font-weight:600;
    letter-spacing:1px;
}

/* ✅ STATUS */
.status{
    font-size:18px;
    margin:15px 0;
}

/* ✅ STATUS CHIP */
.status-box{
    display:inline-block;
    padding:6px 15px;
    border-radius:20px;
    font-weight:bold;
    transition:0.3s;
}

/* ✅ COLORS */
.wait{background:#ffc107;color:#000;}
.ok{background:#00e676;color:#000;}
.err{background:#ff5252;}
/* ✅ GLOW EFFECT */
.ok{box-shadow:0 0 10px #00ff88;}
.err{box-shadow:0 0 10px #ff4444;}
.wait{box-shadow:0 0 10px #ffc107;}

/* ✅ SLIDER STYLE */
.slider{
    width:100%;
    margin-top:20px;
    appearance:none;
    height:8px;
    border-radius:5px;
    background:rgba(255,255,255,0.3);
}
.slider::-webkit-slider-thumb{
    appearance:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#00e5ff;
    box-shadow:0 0 10px #00e5ff;
    cursor:pointer;
}

/* ✅ VALUE */
.value{
    font-size:30px;
    margin-top:12px;
    font-weight:bold;
}

/* ✅ ICON */
.icon{
    font-size:40px;
    margin-top:5px;
}

.fade{
    transition:0.3s;
}

</style>
</head>

<body>

<div class="card">

    <div class="icon">🔊</div>

    <h2>PA Control</h2>

    <!-- ✅ STATUS -->
    <div class="status">
        <span id="status" class="status-box wait">Please Wait...</span>
    </div>

    <!-- ✅ SLIDER -->
    <input type="range" id="slider" min="0" max="100" value="0" class="slider">

    <!-- ✅ VALUE -->
    <div class="value fade">
        <span id="val">--</span>
    </div>

</div>

<script>

// ✅ FIREBASE
const FIREBASE_HOST = "https://eng-system-control-default-rtdb.asia-southeast1.firebasedatabase.app";
const FIREBASE_AUTH = "mJdxQOh70gjBVv9YYj52dETrQVywckLGfL7zxOLS";

// ✅ VARIABLES
let lastValue = null;
let lastUpdateTime = 0;
let connected = false;
let isUserSliding = false;
let writeTimer = null;
let waitingFirebaseConfirm = false;

// ✅ STATUS UI
function setStatus(text,type){
    let el = document.getElementById("status");
    el.innerHTML = text;
    el.className = "status-box " + type;
}

// ✅ READ
async function readData(){
    try{
        let res = await fetch(FIREBASE_HOST + "/ENG_System.json?auth=" + FIREBASE_AUTH);
        let data = await res.json();

        if(!data) return;

        // ✅ pulse detect
        if(data.PA_App_Conn !== lastValue){
            lastValue = data.PA_App_Conn;
            lastUpdateTime = Date.now();

            if(!connected){
                connected = true;
                setStatus("Connected ✅","ok");
            }
        }

        // ✅ sound sync
        if(data.PA_Sound !== undefined){

            if(!isUserSliding){

                if(waitingFirebaseConfirm){
                    if(Number(data.PA_Sound) === Number(slider.value)){
                        waitingFirebaseConfirm = false;
                    }
                }

                if(!waitingFirebaseConfirm){
                    slider.value = data.PA_Sound;
                    document.getElementById("val").innerHTML = data.PA_Sound;
                }
            }
        }

    }catch{}
}

// ✅ connection check
function checkConnection(){

    if(!connected){
        setStatus("Please Wait...","wait");
        return;
    }

    let diff = Date.now() - lastUpdateTime;

    if(diff > 1500){
        connected = false;
        setStatus("Disconnected ❌","err");
    }
}

// ✅ LOOP
setInterval(readData, 400);
setInterval(checkConnection, 300);


// ✅ SLIDER CONTROL
let slider = document.getElementById("slider");

slider.addEventListener("mousedown",()=>isUserSliding=true);
slider.addEventListener("touchstart",()=>isUserSliding=true);

slider.addEventListener("mouseup",()=>isUserSliding=false);
slider.addEventListener("touchend",()=>isUserSliding=false);

// ✅ smooth write
slider.oninput=function(){

    document.getElementById("val").innerHTML = this.value;

    clearTimeout(writeTimer);

    writeTimer=setTimeout(()=>{
        writeSound(this.value);
    },500);

}

// ✅ WRITE
function writeSound(value){

    waitingFirebaseConfirm=true;

    fetch(FIREBASE_HOST + "/ENG_System.json?auth=" + FIREBASE_AUTH,{
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({PA_Sound:value})
    });

}

</script>

</body>
</html>
